name: "Deploy: wiki"

# Thin caller - generated by `foundry generate callers` from the central
# platform.json. The ops repo owns the pipeline; this repo names the service.

on:
  push:
    branches: [release]
    paths: ['wiki/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: foundry-deploy-wiki-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: FoundryMedia/foundry-ops/.github/workflows/deploy.yml@main
    with:
      service: wiki
      environment: prod
    secrets: inherit

name: Wiki (OpenTofu + publish)

# Provisions the wiki's S3 + CloudFront + DNS stack AND publishes the built
# static site. Full tofu-in-CI. (release = prod branch; develop = dev.)
#   PR (wiki/**)                  -> tofu plan + build verify (no publish)
#   push to release (wiki/**)     -> tofu apply + build + s3 sync + invalidate
#   workflow_dispatch             -> apply + publish (manual)
#
# Auth is keyless via OIDC (assumes foundry-wiki-tofu-runner, created by the
# one-time local bootstrap apply). State lives in the shared fgs-prod-iac-state
# bucket under key wiki/tofu.tfstate.
#
# NOTE: add a GitHub Environment ("prod") protection rule with required
# reviewers to gate apply/publish behind manual approval.

on:
  pull_request:
    paths: ['wiki/**', '.github/workflows/wiki.yml']
  push:
    branches: [release]
    paths: ['wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

concurrency:
  group: foundry-wiki-prod
  # A merge to release fires a deploy (push) while the PR's plan run may still
  # be in flight holding the tofu state lock. Let a deploy (push/dispatch)
  # cancel that in-progress PR run so it releases the lock. PR runs never apply
  # (the apply/publish steps are gated to push/dispatch), so cancelling one is
  # always safe; and deploys never cancel each other (no mid-apply interruption).
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  TF_ROLE: arn:aws:iam::561493797917:role/foundry-wiki-tofu-runner
  IAC_DIR: wiki/ci/iac/prod

jobs:
  wiki:
    name: tofu ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'apply + publish' || 'plan' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wiki/package-lock.json

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: tofu init
        working-directory: ${{ env.IAC_DIR }}
        run: tofu init -input=false

      - name: tofu plan
        working-directory: ${{ env.IAC_DIR }}
        # PR plans are read-only previews — don't take the state lock, so they
        # can never block an apply on release. push/dispatch plans lock normally.
        run: tofu plan -input=false -no-color -out plan.tfplan ${{ github.event_name == 'pull_request' && '-lock=false' || '' }}

      - name: tofu apply
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: ${{ env.IAC_DIR }}
        run: tofu apply -input=false -no-color plan.tfplan

      - name: Build static export
        working-directory: wiki
        run: |
          npm ci
          npm run build

      - name: Publish to S3 + invalidate CloudFront
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          BUCKET="$(tofu -chdir=$IAC_DIR output -raw bucket_name)"
          DIST="$(tofu -chdir=$IAC_DIR output -raw distribution_id)"
          echo "::notice::publishing to s3://$BUCKET (distribution $DIST)"
          aws s3 sync wiki/out "s3://$BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/*'

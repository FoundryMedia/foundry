name: Wiki (OpenTofu + publish)

# Provisions the wiki's S3 + CloudFront + DNS stack AND publishes the built
# static site. Full tofu-in-CI. (release = prod branch.)
#   PR (wiki/**)                  -> tofu validate + build verify (NO AWS creds)
#   push to release (wiki/**)     -> tofu apply + build + s3 sync + invalidate
#   workflow_dispatch             -> apply + publish (manual, release branch)
#
# Auth is keyless via OIDC (assumes foundry-wiki-tofu-runner, created by the
# one-time local bootstrap apply). The role's trust policy pins the sub claim
# to refs/heads/release, so PR runs CANNOT assume it — the PR path never
# touches AWS (validate only, no plan against state). Do NOT add a GitHub
# Environment to this job: environment-scoped jobs present a different OIDC
# sub ("environment:<name>") and would fail the trust condition.
# State lives in the shared fgs-prod-iac-state bucket, key wiki/tofu.tfstate.

on:
  pull_request:
    paths: ['wiki/**', '.github/workflows/wiki.yml']
  push:
    branches: [release]
    paths: ['wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

concurrency:
  group: foundry-wiki-prod
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  TF_ROLE: arn:aws:iam::561493797917:role/foundry-wiki-tofu-runner
  IAC_DIR: wiki/ci/iac/prod

jobs:
  wiki:
    name: ${{ github.event_name == 'pull_request' && 'validate + build verify' || 'tofu apply + publish' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wiki/package-lock.json

      # ── PR path: no AWS credentials — syntax/config validation only ──
      - name: tofu validate (no backend)
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.IAC_DIR }}
        run: |
          tofu init -backend=false -input=false
          tofu validate -no-color
          tofu fmt -check -diff

      # ── release path: assume the OIDC role, plan + apply + publish ──
      - name: Configure AWS credentials (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: tofu init
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.IAC_DIR }}
        run: tofu init -input=false

      - name: tofu plan
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.IAC_DIR }}
        run: tofu plan -input=false -no-color -out plan.tfplan

      - name: tofu apply
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.IAC_DIR }}
        run: tofu apply -input=false -no-color plan.tfplan

      - name: Build static export
        working-directory: wiki
        run: |
          npm ci
          npm run build

      - name: Publish to S3 + invalidate CloudFront
        if: github.event_name != 'pull_request'
        run: |
          BUCKET="$(tofu -chdir=$IAC_DIR output -raw bucket_name)"
          DIST="$(tofu -chdir=$IAC_DIR output -raw distribution_id)"
          echo "::notice::publishing to s3://$BUCKET (distribution $DIST)"
          aws s3 sync wiki/out "s3://$BUCKET" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/*'

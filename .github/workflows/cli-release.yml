name: CLI (build + release)

# Builds the Foundry CLI for Windows (PyInstaller one-dir + Inno Setup
# installer) AND macOS arm64 (PyInstaller one-dir tar.gz), and publishes ONE
# GitHub Release that the CLI auto-updater reads (releases/latest). macOS
# installs via cli/package/install.sh (curl | sh).
#
# foundry is PUBLIC, so this self-deploys HERE - a public repo cannot call
# foundry-ops' private reusable workflows (GitHub limitation; the documented
# public-repo exception in foundry-cicd-models.md). Mirrors wiki.yml's
# self-contained pattern.
#   PR (cli/**)               -> build-verify both platforms (no release)
#   push to release (cli/**)  -> build + publish a Release IF the version is new
#   workflow_dispatch         -> build + publish (skips if the version already shipped)
#
# To cut a release: bump cli/pyproject.toml version, merge to release. The run
# detects the new version and publishes; an unchanged version is a no-op.

on:
  pull_request:
    paths: ['cli/**', '.github/workflows/cli-release.yml']
  push:
    branches: [release]
    paths: ['cli/**', '.github/workflows/cli-release.yml']
  workflow_dispatch:

concurrency:
  group: foundry-cli-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install CLI + packaging deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ./cli[dev]
          pip install pyinstaller

      - name: Run tests
        shell: bash
        run: python -m pytest cli/tests -q

      - name: Package (PyInstaller + Inno Setup)
        shell: bash
        env:
          ISCC_PATH: 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
        run: python cli/package/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: cli/package/target/*/*
          retention-days: 3
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CLI + packaging deps
        run: |
          python -m pip install --upgrade pip
          pip install ./cli[dev]
          pip install pyinstaller

      - name: Run tests
        run: python -m pytest cli/tests -q

      - name: Package (PyInstaller onedir tar.gz)
        run: python cli/package/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: cli/package/target/*/*
          retention-days: 3
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          V=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('cli/pyproject.toml').read_text())['project']['version'])")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "CLI version: $V"

      - name: Does this release already exist?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.exists.outputs.exists == 'false'
        with:
          pattern: release-assets-*
          path: assets
          merge-multiple: true

      - name: Publish Release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          ls -la assets/
          gh release create "v$V" -R "$GITHUB_REPOSITORY" \
            --title "Foundry CLI v$V" \
            --notes "Foundry CLI v$V

          Windows: run the installer (.exe). macOS (Apple Silicon):
          \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/release/cli/package/install.sh | sh\`" \
            assets/*

      - name: Already released (no-op)
        if: steps.exists.outputs.exists == 'true'
        run: echo "Release v${{ steps.ver.outputs.version }} already exists - bump cli/pyproject.toml to publish a new one."

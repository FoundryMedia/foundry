[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-cli"
version = "0.11.0"
description = "Foundry CLI - run and manage platform apps"
authors = [{name="Foundry"}]
requires-python = ">=3.9"
dependencies = [
  "click",
  "colorama",
  "cryptography",
  "jsonschema",
  "pyyaml",
  "textual==8.2.8",
  "sshtunnel>=0.4.0"
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
foundry = "foundry_cli.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["foundry_cli*"]

[tool.setuptools.package-data]
foundry_cli = ["resources/VERSION"]